<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LordModi.9 - Unlock Download</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#32105c 0%,#160625 45%,#080313 100%);
  color:white;
  padding:20px 14px 30px;
}

.container{
  max-width:650px;
  margin:auto;
}

/* HEADER */
.header{
  text-align:center;
  padding:15px 10px 25px;
}

.logo{
  width:110px;
  height:110px;
  margin:0 auto 15px;
  border-radius:28px;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.8);
  box-shadow:
    0 0 20px #8d35ff,
    0 0 45px rgba(0,180,255,.35);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.header h1{
  font-size:32px;
  font-weight:800;
  margin-bottom:7px;
}

.header p{
  color:#c9bdd8;
  font-size:16px;
}

/* PROGRESS */
.progress-box{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  color:#ddd;
}

.progress-bar{
  height:10px;
  background:#30213d;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff176f,#7b35ff,#00d9ff);
  border-radius:20px;
  transition:.5s;
}

/* TASK */
.task{
  position:relative;
  background:linear-gradient(
    145deg,
    rgba(75,30,110,.55),
    rgba(20,8,45,.8)
  );
  border:1px solid rgba(255,255,255,.13);
  border-radius:25px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.task-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.icon{
  width:65px;
  height:65px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  background:rgba(255,255,255,.08);
  flex-shrink:0;
}

.task h2{
  font-size:22px;
  margin-bottom:5px;
}

.task p{
  color:#bdb2c9;
  font-size:14px;
}

.btn{
  width:100%;
  border:0;
  margin-top:18px;
  padding:15px;
  border-radius:18px;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,#6931ff,#00a9ff);
  box-shadow:0 8px 20px rgba(76,40,255,.25);
}

.btn:active{
  transform:scale(.98);
}

.youtube{
  background:linear-gradient(90deg,#ff1744,#ff4b2b);
}

.telegram{
  background:linear-gradient(90deg,#397cff,#00bfff);
}

.instagram{
  background:linear-gradient(90deg,#e91e63,#8e24aa,#ff9800);
}

.confirm{
  display:none;
}

.timer{
  text-align:center;
  margin-top:14px;
  color:#00e5ff;
  font-weight:bold;
  font-size:15px;
}

.completed{
  border-color:#00ff91;
}

.success{
  display:none;
  margin-top:14px;
  color:#42ff9b;
  text-align:center;
  font-weight:bold;
}

/* PASSWORD */
#downloadSection{
  display:none;
}

.password-box{
  background:linear-gradient(
    145deg,
    rgba(38,18,65,.95),
    rgba(15,5,30,.95)
  );
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.4);
}

.password-box h2{
  font-size:25px;
  margin-bottom:8px;
}

.password-box p{
  color:#bdb2c9;
  margin-bottom:18px;
}

.password-input{
  width:100%;
  padding:16px;
  border-radius:15px;
  border:1px solid #62477d;
  outline:none;
  background:#12091d;
  color:white;
  text-align:center;
  font-size:22px;
  letter-spacing:8px;
}

.download{
  display:none;
  text-decoration:none;
  margin-top:15px;
  padding:16px;
  border-radius:17px;
  background:linear-gradient(90deg,#00c853,#00e676);
  color:#001b09;
  font-weight:900;
  font-size:17px;
}

.error{
  display:none;
  color:#ff5577;
  margin-top:12px;
  font-weight:bold;
}

.footer{
  text-align:center;
  color:#82758e;
  font-size:13px;
  margin-top:25px;
}
</style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
